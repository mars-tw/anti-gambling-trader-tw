[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-gambling-trader"
version = "0.1.0"
description = "交易統計、投資反詐與自動化交易程式腳架 — 支援台股/美股/加密貨幣"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["trading", "backtest", "statistics", "expectancy", "anti-gambling",
            "algorithmic-trading", "paper-trading", "broker-api",
            "taiwan-stock", "us-stock", "crypto", "survivorship-bias"]
authors = [{ name = "好棒棒反詐協會 - 免費顧問 阿軒割割" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
]
# 核心零依賴
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
screenshot = ["Pillow>=10.0", "pytesseract>=0.3.10"]
backtest = ["backtrader>=1.9", "vectorbt>=0.26"]
dev = ["pytest>=7.0", "PyYAML>=6.0"]

[project.scripts]
anti-gambling-trader = "core.cli:main"

[project.urls]
Homepage = "https://github.com/mars-tw/anti-gambling-trader-tw"
Issues = "https://github.com/mars-tw/anti-gambling-trader-tw/issues"

[tool.setuptools]
packages = [
    "core",
    "core.ingest",
    "core.metrics",
    "core.verdict",
    "core.strategy",
    "core.backtest",
    "core.broker",
    "core.charts",
    "core.scaffold",
    "core.antiscam",
    "core.forensics",
    "core.montecarlo",
    "core.trend",
]

# examples 隨套件打包:demo 與 analyze --example 依賴這些檔案,
# 不打包的話 pip 安裝後的使用者第一個指令(demo)就會 FileNotFoundError。
[tool.setuptools.package-data]
core = ["examples/*.csv", "examples/*.json"]
